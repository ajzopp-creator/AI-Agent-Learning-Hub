[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hub_lib"
version = "0.1.0"
description = "Shared model-routing facade for the AI-Agent-Learning-Hub."
requires-python = ">=3.10"
authors = [{ name = "Tony" }]
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
lmstudio  = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
google    = ["google-genai>=0.8"]
all       = ["openai>=1.40", "anthropic>=0.40", "google-genai>=0.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hub_lib*"]
