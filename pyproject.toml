# C:\Users\Trader\AI-Agent-Learning-Hub\pyproject.toml
# Hub-root editable package (WO-P000-E2.002, extended WO-P000-E5.001).
# ONE installed distribution ("hub_shared") mapping these top-level names:
#   hub_lib            -> shared model-routing facade  (hub_lib\)
#   shared_resources   -> hub-wide shared signal contract + utilities (shared_resources\)
#   obsidian_writers    -> ported from P_800, Hub-level Obsidian write interface (WO-P000-E2.003)
#   integrations        -> bare parent package only, so integrations.lm_studio resolves
#   integrations.lm_studio -> Hub-level LM Studio module (WO-P000-E5.001), scoped
#                             narrowly on purpose -- integrations.automation,
#                             integrations.local_llm, integrations.mcp_servers
#                             stay OUT of this install; not reviewed for this WO.
# include is pinned (NOT excludes) so setuptools never scans projects\ venv\
# or the rest of integrations\ beyond the lm_studio subtree named above.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hub_shared"
version = "0.1.0"
description = "Hub-wide shared infrastructure: hub_lib model routing + shared_resources signal contract."
requires-python = ">=3.10"
authors = [{ name = "Tony" }]
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
lmstudio  = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
google    = ["google-genai>=0.8"]
all       = ["openai>=1.40", "anthropic>=0.40", "google-genai>=0.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hub_lib*", "shared_resources*", "obsidian_writers*", "integrations", "integrations.lm_studio*"]
