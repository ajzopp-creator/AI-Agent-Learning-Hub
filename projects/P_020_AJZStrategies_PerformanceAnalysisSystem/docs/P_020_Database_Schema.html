<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P_020 — Database Schema</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 500; color: #ffffff; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #888; margin: 0 0 24px; }
  .card {
    background: #242424;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 24px;
    max-width: 760px;
  }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #ffffff; }
  .ts { font-size: 12px; font-weight: 400; fill: #aaaaaa; }
  .c-blue rect   { fill: #1a3a5c; stroke: #378ADD; }
  .c-teal rect   { fill: #0a3028; stroke: #1D9E75; }
  .c-amber rect  { fill: #3a2800; stroke: #BA7517; }
  .c-coral rect  { fill: #3a1400; stroke: #993C1D; }
  .c-green rect  { fill: #1a2e0a; stroke: #639922; }
</style>
</head>
<body>
<h1>P_020 AJZ Strategies — Database Schema</h1>
<p class="subtitle">SQLite — 4 tables + 1 computed view | P_020_trades.db | Updated: 2026-03-14</p>
<div class="card">
<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ACCOUNTS -->
<g class="c-blue">
  <rect x="30" y="30" width="185" height="190" rx="8" stroke-width="0.5"/>
</g>
<text class="th" x="122" y="52" text-anchor="middle" dominant-baseline="central">accounts</text>
<line x1="30" y1="66" x2="215" y2="66" stroke="#378ADD" stroke-width="0.5"/>
<text class="ts" x="42" y="84"  dominant-baseline="central">account_id   TEXT PK</text>
<text class="ts" x="42" y="104" dominant-baseline="central">account_name TEXT</text>
<text class="ts" x="42" y="124" dominant-baseline="central">account_type TEXT</text>
<text class="ts" x="42" y="144" dominant-baseline="central">broker       TEXT</text>
<text class="ts" x="42" y="164" dominant-baseline="central">distribution_years INT</text>
<text class="ts" x="42" y="188" dominant-baseline="central" style="fill:#555">3 rows seeded</text>

<!-- SYSTEMS -->
<g class="c-teal">
  <rect x="30" y="250" width="185" height="170" rx="8" stroke-width="0.5"/>
</g>
<text class="th" x="122" y="272" text-anchor="middle" dominant-baseline="central">systems</text>
<line x1="30" y1="286" x2="215" y2="286" stroke="#1D9E75" stroke-width="0.5"/>
<text class="ts" x="42" y="304" dominant-baseline="central">system_id   TEXT PK</text>
<text class="ts" x="42" y="324" dominant-baseline="central">system_name TEXT</text>
<text class="ts" x="42" y="344" dominant-baseline="central">description TEXT</text>
<text class="ts" x="42" y="364" dominant-baseline="central">active      INT</text>
<text class="ts" x="42" y="388" dominant-baseline="central" style="fill:#555">9 rows seeded</text>

<!-- TRADES -->
<g class="c-amber">
  <rect x="248" y="30" width="200" height="420" rx="8" stroke-width="0.5"/>
</g>
<text class="th" x="348" y="52" text-anchor="middle" dominant-baseline="central">trades  ★ primary</text>
<line x1="248" y1="66" x2="448" y2="66" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="260" y="84"  dominant-baseline="central">trade_id          INT PK AUTO</text>
<text class="ts" x="260" y="104" dominant-baseline="central">account_id        TEXT FK</text>
<text class="ts" x="260" y="124" dominant-baseline="central">system            TEXT FK</text>
<text class="ts" x="260" y="144" dominant-baseline="central">underlying_symbol TEXT</text>
<text class="ts" x="260" y="164" dominant-baseline="central">asset_type        TEXT</text>
<text class="ts" x="260" y="184" dominant-baseline="central">direction         TEXT</text>
<text class="ts" x="260" y="204" dominant-baseline="central">open_date         DATE</text>
<text class="ts" x="260" y="224" dominant-baseline="central">qty               REAL</text>
<text class="ts" x="260" y="244" dominant-baseline="central">entry_price       REAL</text>
<text class="ts" x="260" y="264" dominant-baseline="central">stop_price        REAL</text>
<text class="ts" x="260" y="284" dominant-baseline="central">risk_amount       REAL</text>
<text class="ts" x="260" y="304" dominant-baseline="central">total_commissions REAL</text>
<text class="ts" x="260" y="324" dominant-baseline="central">status            TEXT</text>
<text class="ts" x="260" y="344" dominant-baseline="central">schwab_txn_id     TEXT UNIQUE</text>
<text class="ts" x="260" y="364" dominant-baseline="central">source            TEXT</text>
<text class="ts" x="260" y="384" dominant-baseline="central">tags / notes      TEXT</text>
<text class="ts" x="260" y="424" dominant-baseline="central" style="fill:#555">1 row per position opened</text>

<!-- EXITS -->
<g class="c-coral">
  <rect x="480" y="30" width="185" height="240" rx="8" stroke-width="0.5"/>
</g>
<text class="th" x="572" y="52" text-anchor="middle" dominant-baseline="central">exits</text>
<line x1="480" y1="66" x2="665" y2="66" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="492" y="84"  dominant-baseline="central">exit_id          INT PK AUTO</text>
<text class="ts" x="492" y="104" dominant-baseline="central">trade_id         INT FK</text>
<text class="ts" x="492" y="124" dominant-baseline="central">exit_number      INT</text>
<text class="ts" x="492" y="144" dominant-baseline="central">exit_date        DATE</text>
<text class="ts" x="492" y="164" dominant-baseline="central">qty_exited       REAL</text>
<text class="ts" x="492" y="184" dominant-baseline="central">exit_price       REAL</text>
<text class="ts" x="492" y="204" dominant-baseline="central">exit_commissions REAL</text>
<text class="ts" x="492" y="224" dominant-baseline="central">exit_pnl         REAL</text>
<text class="ts" x="492" y="244" dominant-baseline="central" style="fill:#555">1–3 rows per trade</text>

<!-- VIEW -->
<g class="c-green">
  <rect x="480" y="300" width="185" height="100" rx="8" stroke-width="0.5" stroke-dasharray="5 3"/>
</g>
<text class="th" x="572" y="328" text-anchor="middle" dominant-baseline="central">v_trade_summary</text>
<text class="ts" x="572" y="352" text-anchor="middle" dominant-baseline="central">computed view</text>
<text class="ts" x="572" y="372" text-anchor="middle" dominant-baseline="central">trades JOIN exits</text>

<!-- FK ARROWS -->
<path d="M215 104 L246 104" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M215 324 L348 324 L348 452" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M448 104 L478 104" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M448 240 L570 240 L570 298" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- FK labels -->
<text class="ts" x="230" y="98" style="fill:#555">FK</text>
<text class="ts" x="452" y="98" style="fill:#555">FK</text>

<!-- LEGEND -->
<line x1="30" y1="520" x2="60" y2="520" stroke="#555" stroke-width="1"/>
<text class="ts" x="66" y="524" dominant-baseline="central">FK relationship</text>
<line x1="200" y1="520" x2="230" y2="520" stroke="#555" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="236" y="524" dominant-baseline="central">derived (view — no stored data)</text>
<text class="ts" x="30" y="548" style="fill:#555">★ All performance metrics (realized_pnl, realized_R, outcome) computed in v_trade_summary from trades + exits</text>
</svg>
</div>
</body>
</html>
